  }

  // ---------------- Welt ----------------
  buildWorld() {
    // Weltraum: schwarzer Himmel, Sterne, Erde und Sonne
    const space = rgb(0.006, 0.008, 0.02);
    this.scene.background = space;
    this.scene.fog = new THREE.Fog(rgb(0.02, 0.025, 0.05), 320, 1900);
    this.buildSky();

    // Umgebungsbild für Spiegelungen: dunkler Himmel mit hellen Lichtflächen und bläulichem Erdschein
    const env = canvasTexture(1024, 512, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgb(8,10,20)'); g.addColorStop(0.45, 'rgb(28,40,70)'); g.addColorStop(0.55, 'rgb(40,40,48)'); g.addColorStop(1, 'rgb(6,6,8)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      for (const [x, y, rw, rh] of [[80, 122, 200, 60], [430, 88, 300, 34], [780, 112, 150, 80], [300, 186, 70, 26]]) {
        for (let k = 5; k >= 0; k--) {
          const grow = k * 6;
          ctx.fillStyle = `rgba(255,255,255,${k === 0 ? 0.95 : 0.06})`;
          ctx.beginPath(); ctx.roundRect(x - grow, y - grow, rw + 2 * grow, rh + 2 * grow, 10 + grow); ctx.fill();
        }
      }
    });
    env.mapping = THREE.EquirectangularReflectionMapping;
    const pmrem = new THREE.PMREMGenerator(this.renderer);
    this.scene.environment = pmrem.fromEquirectangular(env).texture;

    // Boden: grauer Mondstaub mit Kratern
    const rng = seededRandom(11);
    const groundTex = canvasTexture(1024, 1024, (ctx) => {
      ctx.fillStyle = 'rgb(30,30,34)'; ctx.fillRect(0, 0, 1024, 1024);
      for (let i = 0; i < 20000; i++) {
        const v = Math.floor(rnd(rng, 18, 50));
        ctx.fillStyle = `rgba(${v},${v},${v + 4},0.5)`;
        const sz = rnd(rng, 1, 4);
        ctx.fillRect(rnd(rng, 0, 1024), rnd(rng, 0, 1024), sz, sz);
      }
      for (let i = 0; i < 26; i++) {
        const x = rnd(rng, 0, 1024), y = rnd(rng, 0, 1024), r = rnd(rng, 8, 60);
        const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
        g.addColorStop(0, 'rgba(20,20,24,0.7)'); g.addColorStop(0.8, 'rgba(30,30,34,0.3)'); g.addColorStop(0.92, 'rgba(110,110,116,0.45)'); g.addColorStop(1, 'rgba(46,46,50,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    });
    groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
    groundTex.repeat.set(60, 60);
    groundTex.anisotropy = this.renderer.capabilities.getMaxAnisotropy();
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95 }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    this.scene.add(ground);

    this.buildTracks();
    this.placeParkedCars();
    this.placeScenery();

    this.scene.add(new THREE.HemisphereLight(rgb(0.45, 0.55, 0.9), rgb(0.08, 0.08, 0.1), 0.25));
    const sun = new THREE.DirectionalLight(rgb(1, 0.96, 0.9), 1.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(IS_TOUCH ? 1024 : 2048, IS_TOUCH ? 1024 : 2048);
    Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 160 });
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;
    this.scene.add(sun, sun.target);
    this.moon = sun;
  }

  // Sterne, Erde und Sonne am Himmel (vom Nebel nicht betroffen)
  buildSky() {
    const rng = seededRandom(99);
    const count = 4000, pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const u = rng() * 2 - 1, phi = rng() * Math.PI * 2, r = 3000;
      const y = Math.abs(u) * 0.95 + 0.05;           // nur über dem Horizont
      const k = Math.sqrt(1 - y * y);
      pos.set([Math.cos(phi) * k * r, y * r, Math.sin(phi) * k * r], i * 3);
      const b = 0.4 + rng() * 0.6, warm = rng();
      col.set([b * (0.85 + warm * 0.15), b * 0.9, b * (1.1 - warm * 0.2)], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    this.stars = new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, fog: false }));
    this.scene.add(this.stars);

    // Erde: blaue Kugel mit Kontinenten und Wolken, schräg beleuchtet
    const erng = seededRandom(5);
    const earthTex = canvasTexture(1024, 512, (ctx, w, h) => {
      ctx.fillStyle = '#123a7a'; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 40; i++) {
        ctx.fillStyle = ['#2f6b3a', '#4a7d3c', '#8a7a4a'][i % 3];
        ctx.beginPath();
        ctx.ellipse(rnd(erng, 0, w), rnd(erng, h * 0.15, h * 0.85), rnd(erng, 20, 90), rnd(erng, 15, 60), rnd(erng, 0, 3), 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = 0; i < 160; i++) {
        ctx.fillStyle = `rgba(255,255,255,${rnd(erng, 0.25, 0.7)})`;
        ctx.beginPath();
        ctx.ellipse(rnd(erng, 0, w), rnd(erng, 0, h), rnd(erng, 10, 70), rnd(erng, 3, 12), rnd(erng, -0.3, 0.3), 0, Math.PI * 2);
        ctx.fill();
      }
    });
    const earth = new THREE.Mesh(new THREE.SphereGeometry(420, 64, 32),
      new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.8, emissive: rgb(0.05, 0.12, 0.3), emissiveIntensity: 0.6, fog: false }));
    earth.position.set(-2200, 420, -1500);
    earth.rotation.set(0.3, 1.2, 0.2);
    const glow = new THREE.Mesh(new THREE.SphereGeometry(445, 64, 32),
      new THREE.MeshBasicMaterial({ color: rgb(0.3, 0.6, 1).multiplyScalar(0.6), transparent: true, opacity: 0.35,
                                    side: THREE.BackSide, blending: THREE.AdditiveBlending, fog: false, depthWrite: false }));
    glow.position.copy(earth.position);
    // eigenes Licht nur für die Erde (seitlich, damit eine Tag-Nacht-Grenze entsteht)
    const earthLight = new THREE.PointLight(0xffffff, 6, 0, 0);
    earthLight.position.set(-600, 1100, -600);
    this.scene.add(earth, glow, earthLight);

    // Sonne: heller Fleck in Richtung des Sonnenlichts
    const sunTex = canvasTexture(128, 128, (ctx) => {
      const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.15, 'rgba(255,245,220,0.9)'); g.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
    });
    const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTex, color: new THREE.Color(3, 3, 3), fog: false,
                                                                  blending: THREE.AdditiveBlending, depthWrite: false }));
    sunSprite.scale.set(260, 260, 1);
    sunSprite.position.set(20, 50, 25).normalize().multiplyScalar(2800);
    this.scene.add(sunSprite);
  }

  // Raketenbasis: Raketen auf Startrampen, Kuppeln, Radarschüsseln, Tanks, Leucht-Pylonen
  placeScenery() {
    const rng = seededRandom(21);
    // Abstand zur Strecke (waagerecht) prüfen, damit nichts auf oder über der Bahn steht
    const pts = [];
    for (const t of this.tracks) for (let i = 0; i < t.samples.length; i += 4) pts.push(t.samples[i].p);
    const clearance = (x, z) => Math.min(...pts.map(p => Math.hypot(p.x - x, p.z - z)));
    // Platz neben der Strecke suchen: zufälliger Streckenpunkt + seitlicher Versatz
    const spotNear = (minGap, maxGap, needed) => {
      for (let tries = 0; tries < 400; tries++) {
        const t = this.tracks[Math.floor(rng() * 4)];
        const f = t.samples[Math.floor(rng() * t.samples.length)];
        const side = rng() < 0.5 ? -1 : 1, off = rnd(rng, minGap, maxGap);
        const x = f.p.x + f.r.x * side * off, z = f.p.z + f.r.z * side * off;
        if (clearance(x, z) > needed && !this.sceneryTaken?.some(([sx, sz, sr]) => Math.hypot(sx - x, sz - z) < sr + needed)) {
          (this.sceneryTaken ??= []).push([x, z, needed]);
          return [x, z];
        }
      }
      return null;
    };
    const accents = [rgb(0.85, 0.15, 0.1), rgb(0.1, 0.4, 0.9), rgb(0.95, 0.6, 0.1), rgb(0.2, 0.8, 0.6)];

    [80, 60, 95, 50, 70, 85].forEach((h, i) => {
      const spot = spotNear(45, 140, h * 0.32);
      if (!spot) return;
      const rocket = makeRocket(h, accents[i % accents.length]);
      rocket.position.set(spot[0], 0, spot[1]);
      rocket.rotation.y = rnd(rng, 0, Math.PI * 2);
      this.scene.add(rocket);
      this.obstacles.push(new Obstacle([spot], h * 0.055 * 4.4, h));
    });
    for (let i = 0; i < 6; i++) {
      const r = rnd(rng, 10, 22);
      const spot = spotNear(30, 160, r + 12);
      if (!spot) continue;
      const dome = makeDome(r);
      dome.position.set(spot[0], 0, spot[1]);
      this.scene.add(dome);
      this.obstacles.push(new Obstacle([spot], r, r));
    }
    for (let i = 0; i < 4; i++) {
      const spot = spotNear(30, 160, 18);
      if (!spot) continue;
      const dish = makeDish(rnd(rng, 7, 12));
      dish.position.set(spot[0], 0, spot[1]);
      dish.rotation.y = rnd(rng, 0, Math.PI * 2);
      this.scene.add(dish);
      this.obstacles.push(new Obstacle([spot], 2, 20));
    }
    for (let i = 0; i < 5; i++) {
      const spot = spotNear(25, 140, 14);
      if (!spot) continue;
      const tank = makeTank(rnd(rng, 5, 8), accents[i % accents.length]);
      tank.position.set(spot[0], 0, spot[1]);
      this.scene.add(tank);
      this.obstacles.push(new Obstacle([spot], 7, 18));
    }

    // Leucht-Pylonen entlang der Strecke
    const pylons = [];
    while (pylons.length < 70) {
      const spot = spotNear(14, 40, 9);
      if (!spot) break;
      pylons.push(spot);
      this.obstacles.push(new Obstacle([spot], 0.7, 16));
    }
    const column = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.45, 0.7, 16, 6), Mat.pbr(grey(0.25), { metal: 0.9, rough: 0.35 }), pylons.length);
    const ring = new THREE.InstancedMesh(new THREE.TorusGeometry(1.1, 0.12, 8, 24), Mat.glow(rgb(0.3, 0.8, 1), 3.5), pylons.length * 2);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion().setFromAxisAngle(X, Math.PI / 2), one = V(1, 1, 1);
    pylons.forEach(([x, z], i) => {
      column.setMatrixAt(i, m.compose(V(x, 8, z), new THREE.Quaternion(), one));
      ring.setMatrixAt(2 * i, m.compose(V(x, 13.5, z), q, one));
      ring.setMatrixAt(2 * i + 1, m.compose(V(x, 15.2, z), q, one));
    });
    column.castShadow = true;
    this.scene.add(column, ring);
  }

  buildTracks() {
    const base = 0.06;
    // Bausteine: Kurve (a Grad, Radius r, Querneigung) und S-Kurve (hin und zurück, Richtung bleibt gleich)
    const T = (a, r, bank) => [
      { length: Math.PI * r * Math.abs(a) / 360, yaw: a / 2, bankTo: bank },
      { length: Math.PI * r * Math.abs(a) / 360, yaw: a / 2, bankTo: 0 }
    ];
    const S = (a, r, bank) => [
      { length: Math.PI * r * Math.abs(a) / 180, yaw: a, bankTo: bank },
      { length: Math.PI * r * Math.abs(a) / 90, yaw: -2 * a, bankTo: -bank },
      { length: Math.PI * r * Math.abs(a) / 180, yaw: a, bankTo: 0 }
    ];

    // Abschnitt 1 – Bodenbahn: S-Kurve, Looping, Kurvenkombination, Steilwand mit Überhang, Schikane, Schanze
    const wall = 280;
    const ground1 = new Track(V(0, base, 0), 0, [
      { length: 160 },                                              // 0 Start-Ziel-Gerade
      ...S(45, 55, 10),                                             // 1–3 S-Kurve
      { length: 60 },                                               // 4
      { length: 2 * Math.PI * 18, pitch: 360, shift: 19 },          // 5 Looping
      { length: 70 },                                               // 6
      ...T(-90, 45, -14),                                           // 7–8 Rechtskurve
      { length: 40 },                                               // 9
      ...T(90, 45, 14),                                             // 10–11 Linkskurve
      { length: 30 },                                               // 12
      { length: 60, yaw: 180 * 60 / wall, bankTo: 90 },             // 13 Steilwand …
      { length: 80, yaw: 180 * 80 / wall, bankTo: 115 },            // 14 … mit Überhang
      { length: 80, yaw: 180 * 80 / wall, bankTo: 90 },             // 15
      { length: 60, yaw: 180 * 60 / wall, bankTo: 0 },              // 16
      { length: 50 },                                               // 17
      ...S(-32, 40, -10),                                           // 18–20 Schikane
      { length: 60 },                                               // 21
      { length: 50, pitch: 25 }                                     // 22 Schanze
    ], { slantedSupports: false });

    // jeder weitere Abschnitt beginnt nach einer Lücke, die man fliegend überwinden muss
    const after = (track, gap, height) => {
      const e = track.end();
      const p = e.p.clone().addScaledVector(e.dir, gap);
      p.y = height;
      return { p, heading: e.heading };
    };

    // Abschnitt 2 – Himmelsbahn in 22 m Höhe
    const a2 = after(ground1, 90, 22);
    const sky1 = new Track(a2.p, a2.heading, [
      { length: 220 },                                              // 0 Landezone
      ...S(35, 70, 16),                                             // 1–3
      { length: 80 },                                               // 4
      ...T(180, 60, 30),                                            // 5–6 Kehre
      { length: 150 }                                               // 7
    ], { sky: true });

    // Abschnitt 3 – Höhenbahn in 37 m Höhe: höher als die Himmelsbahn, also hochfliegen
    const a3 = after(sky1, 90, 37);
    const sky2 = new Track(a3.p, a3.heading, [
      { length: 150 },                                              // 0 Landezone
      { length: 2 * Math.PI * 16, pitch: 360, shift: 19 },          // 1 Looping in der Luft
      { length: 60 },                                               // 2
      ...S(-30, 50, -14),                                           // 3–5
      { length: 50 },                                               // 6
      ...T(-180, 50, -28),                                          // 7–8 Kehre
      { length: 100 }                                               // 9
    ], { sky: true });

    // Abschnitt 4 – Landebahn: herunterfliegen, Haarnadel, S-Kurve, zurück zur Start-Ziel-Linie
    const a4 = after(sky2, 50, base);
    const radius = Math.max(35, a4.p.x / 2);
    const turnZ = Math.max(a4.p.z, 0) + 260;   // genug Platz für S-Kurve und Zielgerade
    const landing = (finish) => new Track(a4.p, a4.heading, [
      { length: turnZ - a4.p.z },                                   // 0 Landezone
      ...T(-180, radius, -12),                                      // 1–2 Haarnadel
      { length: 40 },                                               // 3
      ...S(35, 55, 10),                                             // 4–6
      { length: finish }                                            // 7 bis zur Startlinie
    ]);
    // Länge des letzten Stücks so anpassen, dass die Bahn genau an der Startlinie endet
    let finish = turnZ;
    let ground2 = landing(finish);
    finish += ground2.end().p.z + 2;
    ground2 = landing(finish);

    // frei befahrbarer Steilwand-Turm abseits der Strecke
    const tower = new Track(V(380, base, 260), 0, [{ length: 90 }, { length: 18 * 2.1, pitch: 120 }]);

    this.tracks = [ground1, sky1, sky2, ground2, tower];
    for (const t of this.tracks) this.obstacles.push(...t.supportObstacles());
    this.race.checkpoints = [
      { name: 'LOOPING', track: 0, s: ground1.pieceStarts[6] },
      { name: 'STEILWAND', track: 0, s: ground1.pieceStarts[17] },
      { name: 'HIMMELSBAHN', track: 1, s: 0 },
      { name: 'HÖHENBAHN', track: 2, s: 0 },
      { name: 'LANDUNG', track: 3, s: 0 }
    ];

    // Texturen: Fahrbahn mit Plattenfugen, Randsteine in Streifen
    const rng = seededRandom(7);
    const road = canvasTexture(512, 512, (ctx) => {
      ctx.fillStyle = 'rgb(38,41,48)'; ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 9000; i++) {
        const v = Math.floor(rnd(rng, 28, 60));
        ctx.fillStyle = `rgba(${v},${v + 3},${v + 8},${rnd(rng, 0.2, 0.5)})`;
        ctx.fillRect(rnd(rng, 0, 512), rnd(rng, 0, 512), rnd(rng, 1, 4), rnd(rng, 1, 4));
      }
      ctx.fillStyle = 'rgba(20,22,28,0.8)';
      ctx.fillRect(0, 0, 512, 3);                     // Plattenfuge quer
    });
    road.wrapS = road.wrapT = THREE.RepeatWrapping;
    road.anisotropy = this.renderer.capabilities.getMaxAnisotropy();
    const kerbTexture = (color) => {
      const t = canvasTexture(16, 64, (ctx) => {
        ctx.fillStyle = color; ctx.fillRect(0, 0, 16, 32);
        ctx.fillStyle = '#f2f2f2'; ctx.fillRect(0, 32, 16, 32);
      });
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(1, 4);                            // ein Farbwechsel alle 1,25 m
      t.magFilter = THREE.NearestFilter;
      return t;
    };
    const tex = { road, kerbRed: kerbTexture('#d8262a'), kerbBlue: kerbTexture('#2a8cff') };
    for (const t of this.tracks) this.scene.add(t.makeNode(tex));
  }

  placeParkedCars() {
    const rng = seededRandom(42);
    const kinds = [0, 1, 2, 3, 4, 'truck', 'truck'];
    const place = (kindId, x, z, yaw, y = 0.06) => {
      const kind = kindId === 'truck' ? KINDS.truck : KINDS.sedan;
      const node = ParkedCars.node(kind, kindId === 'truck' ? 0 : kindId);
      node.position.set(x, y, z);
      node.rotation.y = yaw;
      this.scene.add(node);
      this.obstacles.push(Obstacle.car(x, z, yaw, kind, y));
    };
    // [Bahn, Stück, Abstand ab Stückanfang, seitlich]
    const spots = [[0, 0, 110, -3.5], [0, 6, 35, 3], [0, 21, 25, -3], [1, 0, 160, -3], [1, 0, 200, 3.5],
                   [1, 7, 90, 2.5], [2, 2, 35, -3], [3, 0, 140, 3.5], [3, 3, 20, -3]];
    spots.forEach(([track, piece, offset, d], i) => {
      const t = this.tracks[track];
      const f = t.frame(t.pieceStarts[piece] + offset);
      const p = f.p.clone().addScaledVector(f.r, d);
      place(kinds[i % kinds.length], p.x, p.z, Math.atan2(-f.t.x, -f.t.z) + rnd(rng, -0.4, 0.4), p.y);
    });
    let placed = 0;
    while (placed < 10) {
      const x = rnd(rng, -500, 500), z = rnd(rng, -900, 400);
      const p = V(x, 0, z);
      if (this.tracks.some(t => { const hit = t.nearest(p); return hit && Math.abs(hit.d) < t.halfWidth + 6; })) continue;
      if (Math.hypot(x, z) < 20) continue;
      place(kinds[Math.floor(rng() * kinds.length)], x, z, rnd(rng, 0, Math.PI * 2));
      placed++;
    }
  }

  // ---------------- Spielschleife ----------------
  frame() {
    const now = performance.now();
    const dt = Math.min((now - this.last) / 1000, 1 / 30);
    this.last = now;
    this.step(dt);
    this.particles.update(dt);
    this.particles.material.uniforms.uScale.value =
      this.renderer.domElement.height / (2 * Math.tan(this.camera.fov * DEG / 2));
    this.composer.render();
    this.hud.draw(this.hudState());
    // START-Knopf nur zeigen, wenn gerade kein Rennen läuft
    this.startButton ??= document.getElementById('startButton');
    this.startButton.classList.toggle('hidden', this.race.phase === 'running' || this.race.phase === 'countdown');
  }

  readControls() {
    const i = this.input;
    const left = i.isDown('KeyA', 'ArrowLeft'), right = i.isDown('KeyD', 'ArrowRight');
    let steerTarget = (left ? 1 : 0) - (right ? 1 : 0);
    if (i.analogSteer !== null) steerTarget = i.analogSteer;   // Wischlenkung auf dem Handy
    const brake = i.isDown('KeyS', 'ArrowDown');
    // Handy: im Rennen gibt das Auto automatisch Gas
    const autoGas = IS_TOUCH && this.race.phase === 'running' && !brake;
    return {
      gas: i.isDown('KeyW', 'ArrowUp') || autoGas, brake, steerTarget,
      jetsHeld: i.isDown('Space'), jump: i.wasPressed('Space'), flip: i.wasPressed('KeyK'),
      drift: i.isDown('ShiftLeft', 'ShiftRight', 'KeyX')
    };
  }

  step(dt) {
    if (this.input.wasPressed('KeyR')) {
      if (this.race.phase === 'running') this.respawn(false); else this.reset();
    }
    if (this.input.wasPressed('Enter') && this.race.phase !== 'running') { this.reset(); this.race.start(); }
    this.race.update(dt);
    this.crashCooldown = Math.max(0, this.crashCooldown - dt);
    if (this.race.phase !== this.lastPhase) { this.overlayHidden = false; this.lastPhase = this.race.phase; }
    if ((this.race.phase === 'ready' || this.race.phase === 'finished') && Math.abs(this.speed) > 2) this.overlayHidden = true;

    let c = this.readControls();
    if (this.race.controlsLocked) c = { gas: false, brake: false, steerTarget: 0, jetsHeld: false, jump: false, flip: false, drift: false };
    this.controls = c;
    this.steer += (c.steerTarget - this.steer) * Math.min(1, dt * (this.input.analogSteer !== null ? 14 : 8));
    this.drifting = false;
    this.autoSuction = false;
    this.boostTime = Math.max(0, this.boostTime - dt);
    this.attachCooldown = Math.max(0, this.attachCooldown - dt);
    this.jumpBurst = Math.max(0, this.jumpBurst - dt);
    this.warning = false;

    if (this.mode === 'ground') this.stepGround(c, dt);
    else if (this.mode === 'track') this.stepTrack(c, dt);
    else this.stepAir(c, dt);
    // Im Rennen ist der Boden neben der Strecke verboten: zurück zum letzten Checkpoint
    if (this.mode === 'ground' && this.race.phase === 'running') this.respawn(true);
    this.updatePose();

    let pitchTarget = 0;
    if (this.mode !== 'air') {
      if (c.gas && this.speed >= 0) pitchTarget = 0.025;
      else if (c.brake && this.speed > 1) pitchTarget = -0.03;
    }
    this.pitch += (pitchTarget - this.pitch) * Math.min(1, dt * 6);

    const car = this.car;
    car.root.position.copy(this.carPosition);
    car.root.quaternion.copy(this.carOrientation);
    car.body.rotation.set(this.pitch, 0, 0);
    car.updateWheels(this.speed, this.steer, dt);
    // seitliche Düsen: beim Drehen in der Luft und beim Driften
    const yawJets = (this.mode === 'air' || this.drifting) && Math.abs(this.steer) > 0.15 ? Math.sign(this.steer) : 0;
    car.setJets(this.mode === 'air' && (c.jetsHeld || this.jumpBurst > 0), (c.gas && this.speed >= 0) || this.boostTime > 0,
                this.flipRemaining > 0, yawJets);
    car.setSuction(this.autoSuction);
    this.wallFlash = Math.max(0, this.wallFlash - dt);
    car.root.updateMatrixWorld(true);
    car.emitJets(dt);

    this.updateCamera(dt);
  }

  hudState() {
    const r = this.race;
    return {
      kmh: Math.round(Math.abs(this.mode === 'air' ? this.airVelocity.length() : this.speed) * 3.6),
      suction: this.autoSuction, gapAhead: this.mode === 'track' && this.gapAhead,
      drifting: this.drifting, driftCharge: this.driftCharge, boost: this.boostTime > 0,
      phase: r.phase, countdown: r.countdown, raceTime: r.raceTime, lap: r.lap, laps: r.laps,
      nextTarget: r.nextTarget, lapTimes: r.lapTimes, bestTotal: r.bestTotal, bestLap: r.bestLap,
      message: r.message, messageAge: r.messageAge, newRecord: r.newRecord, overlayHidden: this.overlayHidden,
      car: { x: this.carPosition.x, z: this.carPosition.z, yaw: this.headingYaw() }
    };
  }

  // Fahrtrichtung von oben gesehen (für die Minikarte)
  headingYaw() {
    const f = V(0, 0, -1).applyQuaternion(this.carOrientation);
    return Math.atan2(-f.x, -f.z);
  }

  // ---------------- Fahren ----------------
  applyThrottle(c, dt, canStop = true) {
    if (c.gas) {
      if (this.speed < 0) this.speed += this.brakeDeceleration * dt;
      else this.speed += this.launchAcceleration * Math.max(0.08, 1 - this.speed / this.maxSpeed) * dt;
    }
    if (c.brake) {
      if (this.speed > 0.5) this.speed -= this.brakeDeceleration * dt;
      else this.speed = Math.max(this.speed - 12 * dt, -20);
    }
    if (!c.gas && !c.brake) {
      // Rollwiderstand + Luftwiderstand
      const drag = (0.6 + 0.0025 * this.speed * this.speed) * dt;
      if (Math.abs(this.speed) <= drag) { if (canStop) this.speed = 0; }
      else this.speed -= this.speed > 0 ? drag : -drag;
    }
  }

  // Wie schnell sich das Auto drehen kann: bei Tempo begrenzt (Querbeschleunigung), beim Driften deutlich mehr
  steeringRate(drifting) {
    const v = Math.abs(this.speed);
    const grip = Math.min(1, v / 5);
    const direction = this.speed >= 0 ? 1 : -1;
    const maxRate = drifting ? Math.min(2.7, 85 / Math.max(v, 1)) : Math.min(2.1, 36 / Math.max(v, 1));
    return this.steer * maxRate * grip * direction;
  }

  // Drift: Taste halten + lenken. Seitliche Düsen drehen das Auto quer; loslassen gibt einen Boost.
  updateDrift(c, dt) {
    const drifting = c.drift && this.speed > 12 && Math.abs(this.steer) > 0.2;
    if (drifting) {
      this.driftCharge += dt;
    } else if (this.driftCharge > 0) {
      if (this.driftCharge > 0.5) {
        const level = this.driftCharge > 1.5 ? 2 : 1;
        this.speed = Math.min(this.speed + 9 * level, this.maxSpeed + 12);
        this.boostTime = 0.5 * level;
        this.race.show(level === 2 ? 'SUPER-BOOST!' : 'BOOST!');
      }
      this.driftCharge = 0;
    }
    this.drifting = drifting;
    return drifting;
  }

  // Fahrtrichtung folgt der Ausrichtung des Autos; beim Driften rutscht es (Bewegung hängt hinterher)
  slide(heading, move, drifting, dt) {
    const grip = drifting ? 2.2 : 12;
    move += (heading - move) * Math.min(1, grip * dt);
    const slip = heading - move;
    this.speed -= this.speed * Math.abs(Math.sin(slip)) * (drifting ? 0.35 : 1.2) * dt;   // Reifen radieren
    if (this.boostTime > 0) this.speed = Math.min(this.speed + 25 * dt, this.maxSpeed + 12);
    return move;
  }

  stepGround(c, dt) {
    this.applyThrottle(c, dt);
    const drifting = this.updateDrift(c, dt);
    this.yaw += this.steeringRate(drifting) * dt;
    this.moveYaw = this.slide(this.yaw, this.moveYaw, drifting, dt);
    const fx = -Math.sin(this.yaw), fz = -Math.cos(this.yaw);
    const mx = -Math.sin(this.moveYaw), mz = -Math.cos(this.moveYaw);
    this.groundX = clamp(this.groundX + mx * this.speed * dt, -this.worldLimit, this.worldLimit);
    this.groundZ = clamp(this.groundZ + mz * this.speed * dt, -this.worldLimit, this.worldLimit);

    for (const push of [this.collide(this.groundX, this.groundZ, fx, fz, 0), this.collideWithTrackSlabs(this.groundX, this.groundZ)]) {
      if (!push) continue;
      this.groundX += push[0]; this.groundZ += push[1];
      this.bounce(push, fx, fz);
    }

    if (c.flip) return this.launch(this.flipJumpSpeed, true);
    if (c.jump) return this.launch(this.jumpSpeed, false);

    const p = V(this.groundX, 0, this.groundZ);
    for (let i = 0; i < this.tracks.length; i++) {
      const track = this.tracks[i];
      const hit = track.nearest(p);
      if (!hit || !hit.frame.groundLevel || Math.abs(hit.d) >= track.halfWidth - 1 || Math.abs(hit.h) >= 0.6) continue;
      const f3 = V(fx, 0, fz);
      const psi = Math.atan2(-f3.dot(hit.frame.r), f3.dot(hit.frame.t));
      Object.assign(this, { trackIndex: i, trackS: hit.s, trackD: hit.d, trackPsi: psi, trackMove: psi, mode: 'track' });
      return;
    }
  }

  stepTrack(c, dt) {
    const track = this.tracks[this.trackIndex];
    let f = track.frame(this.trackS);
    const moveDir = f.t.clone().multiplyScalar(Math.cos(this.trackMove)).addScaledVector(f.r, -Math.sin(this.trackMove));

    this.applyThrottle(c, dt, f.groundLevel);
    this.speed += -this.gravity * moveDir.y * dt;   // bergauf langsamer, bergab schneller
    const drifting = this.updateDrift(c, dt);
    this.trackPsi += this.steeringRate(drifting) * dt;
    this.trackMove = this.slide(this.trackPsi, this.trackMove, drifting, dt);
    const ds = this.speed * Math.cos(this.trackMove) * dt;
    this.trackS += ds;
    this.trackD -= this.speed * Math.sin(this.trackMove) * dt;
    // Die Bahn biegt sich unter dem Auto weg: Ohne Lenken fährt es geradeaus weiter (Richtung Wand)
    this.trackPsi += f.kappaG * ds;
    this.trackMove += f.kappaG * ds;

    if (track.closed) {
      this.trackS %= track.length;
      if (this.trackS < 0) this.trackS += track.length;
    } else if (this.trackS < 0 || this.trackS > track.length) {
      // Bahnende: nahtlos auf einen anschließenden Abschnitt wechseln, sonst abheben
      if (!this.transferToOtherTrack()) this.leaveTrack();
      return;
    }
    f = track.frame(this.trackS);

    // Begrenzungsmauern wie bei Mario Kart: abprallen, Tempo verlieren
    const wallLimit = track.halfWidth - 1.0;
    if (track.rails && Math.abs(this.trackD) > wallLimit) {
      const side = Math.sign(this.trackD);
      this.trackD = side * wallLimit;
      const outward = -Math.sin(this.trackMove) * side;
      if (outward > 0) {
        const hit = Math.abs(Math.sin(this.trackMove));
        this.speed *= 1 - 0.7 * hit;
        this.trackMove = -this.trackMove * 0.25;   // leicht von der Wand weg
        this.trackPsi *= 0.5;
        if (hit * Math.abs(this.speed) > 6) this.wallFlash = 0.25;
      }
    }

    // geparkte Autos (auch auf den Himmelsbahnen)
    const p = f.p.clone().addScaledVector(f.r, this.trackD);
    const fwd = f.t.clone().multiplyScalar(Math.cos(this.trackPsi)).addScaledVector(f.r, -Math.sin(this.trackPsi));
    const push = this.collide(p.x, p.z, fwd.x, fwd.z, p.y);
    if (push) {
      const push3 = V(push[0], 0, push[1]);
      this.trackD += push3.dot(f.r);
      this.trackS += push3.dot(f.t);
      this.bounce(push, fwd.x, fwd.z);
    }

    if (Math.abs(this.trackD) > track.halfWidth) return this.leaveTrack();

    // Haftung: Fliehkraft + Schwerkraft; die Saugdüsen helfen automatisch
    const cosMove = Math.cos(this.trackMove);
    const pressure = this.speed * this.speed * f.kappa * cosMove * cosMove + this.gravity * f.n.y;
    this.autoSuction = !f.groundLevel && pressure < 5;
    // Hinweis kurz vor dem Ende eines Abschnitts, wenn danach eine Lücke kommt
    const cp = this.race.checkpoints[this.race.nextCheckpoint];
    this.gapAhead = this.race.phase === 'running' && cp && cp.track !== this.trackIndex && cp.s === 0 &&
                    !track.closed && track.length - this.trackS < 220;
    if (pressure + this.suctionStrength < -0.5) return this.leaveTrack();

    this.race.progress(this.trackIndex, this.trackS);

    if (c.flip) return this.launch(this.flipJumpSpeed, true);
    if (c.jump) return this.launch(this.jumpSpeed, false);
  }

  // am Ende einer Bahn direkt auf eine andere wechseln, die dort anschließt
  transferToOtherTrack() {
    this.updatePose();
    const forward = V(0, 0, -1).applyQuaternion(this.carOrientation);
    for (let i = 0; i < this.tracks.length; i++) {
      if (i === this.trackIndex) continue;
      const hit = this.tracks[i].nearest(this.carPosition);
      if (!hit || Math.abs(hit.d) >= this.tracks[i].halfWidth || Math.abs(hit.h) >= 1.0) continue;
      const heading = forward.clone().addScaledVector(hit.frame.n, -forward.dot(hit.frame.n)).normalize();
      const psi = Math.atan2(-heading.dot(hit.frame.r), heading.dot(hit.frame.t));
      Object.assign(this, { trackIndex: i, trackS: hit.s, trackD: hit.d, trackPsi: psi, trackMove: psi });
      this.race.progress(i, hit.s);
      return true;
    }
    return false;
  }

  // nach einem Absturz (oder mit R) zum letzten Checkpoint zurück
  respawn(penalty) {
    const r = this.race.respawnPoint;
    if (penalty) this.race.fall();
    Object.assign(this, { mode: 'track', trackIndex: r.track, trackS: r.s + 2, trackD: 0, trackPsi: 0, trackMove: 0,
                          speed: 0, flipRemaining: 0, steer: 0, driftCharge: 0, boostTime: 0 });
    this.updatePose();
    // Kamera sofort hinter das Auto setzen
    const forward = V(0, 0, -1).applyQuaternion(this.carOrientation);
    const up = V(0, 1, 0).applyQuaternion(this.carOrientation);
    this.cameraUp.copy(up);
    this.cameraPosition.copy(this.carPosition).addScaledVector(forward, -9).addScaledVector(up, 3);
  }

  stepAir(c, dt) {
    const up = V(0, 1, 0).applyQuaternion(this.airOrientation);
    const forward = V(0, 0, -1).applyQuaternion(this.airOrientation);
    this.airVelocity.y -= this.gravity * dt;
    if (c.jetsHeld) this.airVelocity.y += this.hoverThrust * dt;   // Düsen drücken immer senkrecht nach oben
    const flat = V(forward.x, 0, forward.z);
    if (flat.lengthSq() > 0.01) flat.normalize();
    // agil: Gas schiebt kräftig nach vorne, Bremse bremst in der Luft stark ab
    if (c.gas) this.airVelocity.addScaledVector(flat, 22 * dt);
    if (c.brake) {
      const hv = Math.hypot(this.airVelocity.x, this.airVelocity.z);
      if (hv > 0.1) {
        const k = Math.max(0, hv - 40 * dt) / hv;
        this.airVelocity.x *= k; this.airVelocity.z *= k;
      }
    }
    // Kickflip: K oder ein zweiter Druck auf Sprung in der Luft
    if ((c.flip || c.jump) && !this.flipUsed && this.flipRemaining <= 0) {
      this.flipRemaining = 2 * Math.PI;
      this.flipUsed = true;
    }
    // drehen mit den Seitendüsen; die Flugrichtung dreht ein Stück mit (wendiger)
    const yawStep = this.steer * 3.0 * dt;
    this.airOrientation.premultiply(qAxis(up, yawStep));
    const turn = qAxis(Y, yawStep * 0.7);
    const horizontal = V(this.airVelocity.x, 0, this.airVelocity.z).applyQuaternion(turn);
    this.airVelocity.x = horizontal.x; this.airVelocity.z = horizontal.z;
    // Lagestabilisierung: außer beim Kickflip richtet sich das Auto in der Luft langsam waagerecht aus
    if (this.flipRemaining <= 0 && Math.hypot(forward.x, forward.z) > 0.2) {
      const level = new THREE.Quaternion().setFromAxisAngle(Y, Math.atan2(-forward.x, -forward.z));
      this.airOrientation.slerp(level, 1 - Math.exp(-2.5 * dt));
    }
    if (this.flipRemaining > 0) {
      const delta = Math.min(this.flipRemaining, 2 * Math.PI / this.flipDuration * dt);
      this.airOrientation.multiply(qAxis(Z, delta));
      this.flipRemaining -= delta;
    }
    this.airOrientation.normalize();
    // leichter Luftwiderstand, damit man nicht endlos weiterfliegt
    const drag = Math.exp(-0.1 * dt);
    this.airVelocity.x *= drag; this.airVelocity.z *= drag;
    const hv = Math.hypot(this.airVelocity.x, this.airVelocity.z);
    if (hv > 115) { this.airVelocity.x *= 115 / hv; this.airVelocity.z *= 115 / hv; }
    this.airCenter.addScaledVector(this.airVelocity, dt);
    if (this.airCenter.y > 150) { this.airCenter.y = 150; this.airVelocity.y = Math.min(this.airVelocity.y, 0); }

    if (this.airCenter.y <= this.centerHeight && this.airVelocity.y <= 0) return this.landOnGround();

    // Bahnen sind fest: von unten prallt man an der Unterseite ab
    for (const track of this.tracks) {
      const hit = track.nearest(this.airCenter);
      if (!hit || Math.abs(hit.d) >= track.halfWidth + 0.5) continue;
      const n = hit.frame.n, vn = this.airVelocity.dot(n);
      if (hit.h < -0.4 && hit.h > -1.6 && vn > 0) {
        this.airVelocity.addScaledVector(n, -vn * 1.4);
        this.airCenter.addScaledVector(n, -1.6 - hit.h);
      }
    }
    if (this.attachCooldown > 0) return;

    for (let i = 0; i < this.tracks.length; i++) {
      const track = this.tracks[i];
      const hit = track.nearest(this.airCenter);
      if (!hit) continue;
      const n = hit.frame.n;
      if (Math.abs(hit.d) >= track.halfWidth || hit.h <= -0.3 || hit.h >= 1.3) continue;
      if (this.airVelocity.dot(n) >= 0) continue;   // landen klappt überall, die Saugdüsen halten das Auto
      const planeVelocity = this.airVelocity.clone().addScaledVector(n, -this.airVelocity.dot(n));
      let heading = forward.clone().addScaledVector(n, -forward.dot(n));
      if (heading.length() < 0.1) heading = planeVelocity.length() > 0.1 ? planeVelocity.clone() : hit.frame.t.clone();
      heading.normalize();
      const psi = Math.atan2(-heading.dot(hit.frame.r), heading.dot(hit.frame.t));
      Object.assign(this, { trackIndex: i, trackS: hit.s, trackD: clamp(hit.d, -track.halfWidth + 1.1, track.halfWidth - 1.1),
                            trackPsi: psi, trackMove: psi, speed: planeVelocity.dot(heading), flipRemaining: 0, mode: 'track' });
      return;
    }
  }

  launch(upSpeed, flip) {
    this.updatePose();
    this.airOrientation.copy(this.carOrientation);
    const up = V(0, 1, 0).applyQuaternion(this.carOrientation);
    const forward = V(0, 0, -1).applyQuaternion(this.carOrientation);
    this.airCenter.copy(this.carPosition).addScaledVector(up, this.centerHeight);
    this.airVelocity.copy(forward).multiplyScalar(this.speed).addScaledVector(up, upSpeed);
    Object.assign(this, { flipRemaining: flip ? 2 * Math.PI : 0, flipUsed: flip, jumpBurst: 0.3, attachCooldown: 0.25,
                          driftCharge: 0, mode: 'air' });
  }

  leaveTrack() {
    const track = this.tracks[this.trackIndex];
    this.updatePose();
    const f = track.frame(this.trackS);
    const forward = V(0, 0, -1).applyQuaternion(this.carOrientation);
    if (f.groundLevel && this.carPosition.y < 0.5) {
      this.yaw = this.moveYaw = Math.atan2(-forward.x, -forward.z);
      this.groundX = this.carPosition.x; this.groundZ = this.carPosition.z;
      this.mode = 'ground';
    } else {
      const up = V(0, 1, 0).applyQuaternion(this.carOrientation);
      this.airOrientation.copy(this.carOrientation);
      this.airCenter.copy(this.carPosition).addScaledVector(up, this.centerHeight);
      this.airVelocity.copy(forward).multiplyScalar(this.speed);
      Object.assign(this, { flipRemaining: 0, flipUsed: false, attachCooldown: 0.4, mode: 'air' });
    }
  }

  landOnGround() {
    const forward = V(0, 0, -1).applyQuaternion(this.airOrientation);
    let fx = forward.x, fz = forward.z;
    if (Math.hypot(fx, fz) < 0.3) {
      if (Math.hypot(this.airVelocity.x, this.airVelocity.z) > 0.5) { fx = this.airVelocity.x; fz = this.airVelocity.z; }
      else { fx = -Math.sin(this.yaw); fz = -Math.cos(this.yaw); }
    }
    this.yaw = this.moveYaw = Math.atan2(-fx, -fz);
    this.speed = this.airVelocity.x * -Math.sin(this.yaw) + this.airVelocity.z * -Math.cos(this.yaw);
    this.groundX = this.airCenter.x; this.groundZ = this.airCenter.z;
    this.flipRemaining = 0;
    this.mode = 'ground';
  }

  reset() {
    Object.assign(this, { mode: 'track', trackIndex: 0, trackS: 3, trackD: 0, trackPsi: 0, trackMove: 0, speed: 0,
                          flipRemaining: 0, driftCharge: 0, boostTime: 0 });
  }

  updatePose() {
    if (this.mode === 'ground') {
      this.carPosition.set(this.groundX, 0, this.groundZ);
      this.carOrientation.setFromAxisAngle(Y, this.yaw);
    } else if (this.mode === 'track') {
      const f = this.tracks[this.trackIndex].frame(this.trackS);
      const forward = f.t.clone().multiplyScalar(Math.cos(this.trackPsi)).addScaledVector(f.r, -Math.sin(this.trackPsi)).normalize();
      const right = V().crossVectors(forward, f.n);
      this.carPosition.copy(f.p).addScaledVector(f.r, this.trackD);
      this.carOrientation.setFromRotationMatrix(new THREE.Matrix4().makeBasis(right, f.n, forward.clone().negate()));
    } else {
      this.carOrientation.copy(this.airOrientation);
      this.carPosition.copy(this.airCenter).addScaledVector(V(0, 1, 0).applyQuaternion(this.airOrientation), -this.centerHeight);
    }
  }

  // ---------------- Kollisionen ----------------
  // Auto als drei Kreise hintereinander; liefert [dx, dz] zum Herausschieben oder null
  collide(px, pz, fx, fz, bottom) {
    let ox = 0, oz = 0;
    for (const o of this.obstacles) {
      if (bottom >= o.base + o.height || bottom < o.base - 1) continue;
      if (Math.hypot(px - o.center[0], pz - o.center[1]) > o.reach + 2.5) continue;
      for (const k of [-1.3, 0, 1.3]) {
        const mx = px + fx * k, mz = pz + fz * k;
        for (const [cx, cz] of o.circles) {
          const dx = mx - cx, dz = mz - cz, dist = Math.hypot(dx, dz), minimum = o.radius + 0.9;
          if (dist < minimum && dist > 1e-4) { ox += dx / dist * (minimum - dist); oz += dz / dist * (minimum - dist); }
        }
      }
    }
    return ox || oz ? [ox, oz] : null;
  }

  // Die Fahrbahn ist fest: vom Boden aus gegen Steilwand, Looping oder Bahnkante prallt man ab
  collideWithTrackSlabs(px, pz) {
    const center = V(px, this.centerHeight, pz);
    const carRadius = 1.0, thickness = 0.5;
    for (const track of this.tracks) {
      const hit = track.nearest(center);
      if (!hit || hit.frame.groundLevel) continue;
      const f = hit.frame;
      const side = Math.abs(hit.d) - track.halfWidth;
      if (side >= carRadius || hit.h >= carRadius || hit.h <= -thickness - carRadius) continue;
      const pushes = [
        [carRadius - side, f.r.clone().multiplyScalar(hit.d > 0 ? 1 : -1)],
        [carRadius - hit.h, f.n.clone()],
        [hit.h + thickness + carRadius, f.n.clone().negate()]
      ];
      const [depth, dir] = pushes.reduce((a, b) => (b[0] < a[0] ? b : a));
      const l = Math.hypot(dir.x, dir.z);
      if (l <= 0.2) continue;
      return [dir.x / l * depth / l, dir.z / l * depth / l];
    }
    return null;
  }

  bounce(push, fx, fz) {
    if ((fx * push[0] + fz * push[1]) * this.speed < 0) {
      if (Math.abs(this.speed) > 5 && this.crashCooldown === 0) { this.race.crash(); this.crashCooldown = 1; }
      this.speed = Math.abs(this.speed) > 3 ? -this.speed * 0.3 : 0;
    }
  }

  // ---------------- Kamera ----------------
  updateCamera(dt) {
    const forward = V(0, 0, -1).applyQuaternion(this.carOrientation);
    const desiredUp = this.mode === 'air' ? V(0, 1, 0) : V(0, 1, 0).applyQuaternion(this.carOrientation);
    this.cameraUp.lerp(desiredUp, 1 - Math.exp(-4 * dt)).normalize();
    const target = this.carPosition.clone().addScaledVector(forward, -9).addScaledVector(this.cameraUp, 3);
    target.y = Math.max(target.y, 0.4);
    this.cameraPosition.lerp(target, 1 - Math.exp(-6 * dt));
    this.cameraPosition.y = Math.max(this.cameraPosition.y, 0.4);
    this.camera.position.copy(this.cameraPosition);
    this.camera.up.copy(this.cameraUp);
    this.camera.lookAt(this.carPosition.clone().addScaledVector(this.cameraUp, 1).addScaledVector(forward, 3));
    this.camera.fov = 62 + Math.min(Math.abs(this.speed), 112) * 0.15;
    this.camera.updateProjectionMatrix();

    this.moon.position.copy(this.carPosition).add(V(20, 50, 25));
    this.moon.target.position.copy(this.carPosition);
    this.stars.position.copy(this.camera.position);
  }
}

try {
  window.game = new Game();
} catch (e) {
  document.getElementById('loading').textContent = 'FEHLER: ' + e.message;
  throw e;
}
</script>
