<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Holzblasinstrumentensnake</title>
  <meta name="description" content="Snake mit Querflöte, Oboe, Klarinette oder Fagott – jedes Instrument frisst sein eigenes Futter. Ein Minispiel von Martin Streiter.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Martin Streiter">
  <meta property="og:title" content="Holzblasinstrumentensnake">
  <meta property="og:description" content="Snake mit Querflöte, Oboe, Klarinette oder Fagott – jedes Instrument frisst sein eigenes Futter. Ein Minispiel von Martin Streiter.">
  <meta property="og:url" content="https://martinstreiter.de/snake.html">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="game-page">
    <a class="back" href="index.html">← Zurück</a>

    <h1>Holzblasinstrumentensnake</h1>
    <p class="game-info">Wähle dein Instrument. Jedes frisst etwas anderes und wächst davon unterschiedlich stark.</p>

    <div class="instruments" id="instruments" role="group" aria-label="Instrument"></div>

    <div class="score">
      <span>Punkte <b id="score">0</b></span>
      <span>Rekord <b id="best">0</b></span>
    </div>

    <div class="game" id="game">
      <canvas id="board" aria-label="Spielfeld"></canvas>
    </div>

    <div class="pad">
      <button class="up" data-dir="up" aria-label="Hoch">↑</button>
      <button class="left" data-dir="left" aria-label="Links">←</button>
      <button class="mid" id="pause" aria-label="Start / Pause">▶</button>
      <button class="right" data-dir="right" aria-label="Rechts">→</button>
      <button class="down" data-dir="down" aria-label="Runter">↓</button>
    </div>

    <ul class="legend" id="legend"></ul>
  </main>

  <a class="impressum-link" href="impressum.html">Impressum</a>

  <script src="js/snake.js"></script>
</body>
</html>
